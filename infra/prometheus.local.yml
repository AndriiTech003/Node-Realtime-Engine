global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: realtime
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:4301", "127.0.0.1:4302", "127.0.0.1:4303"]
  - job_name: haproxy
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:4399"]
