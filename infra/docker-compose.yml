name: node-realtime-engine

x-node: &node
  build:
    context: ..
    dockerfile: packages/server/Dockerfile
  image: node-realtime-engine/server:local
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
  stop_grace_period: 30s
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  deploy:
    resources:
      limits:
        cpus: "1"
        memory: 1g

x-node-env: &node-env
  REDIS_URL: redis://redis:6379/3
  REDIS_PREFIX: "rt:"
  JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
  SERVER_API_KEY: ${SERVER_API_KEY:-dev-server-key-change-me}
  ALLOWED_ORIGINS: http://localhost:4321,http://127.0.0.1:4321
  DRAIN_NOTIFY_DELAY_MS: "2500"
  HOST: 0.0.0.0

services:
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "1"

  node-1:
    <<: *node
    hostname: node-1
    environment:
      <<: *node-env
      NODE_ID: node-1
      PORT: "4301"

  node-2:
    <<: *node
    hostname: node-2
    environment:
      <<: *node-env
      NODE_ID: node-2
      PORT: "4302"

  node-3:
    <<: *node
    hostname: node-3
    environment:
      <<: *node-env
      NODE_ID: node-3
      PORT: "4303"

  haproxy:
    image: haproxy:3.2-alpine
    depends_on: [node-1, node-2, node-3]
    environment:
      HAPROXY_BIND: 0.0.0.0:4300
      HAPROXY_STATS_BIND: 0.0.0.0:4399
      NODE1_ADDR: node-1:4301
      NODE2_ADDR: node-2:4302
      NODE3_ADDR: node-3:4303
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "4300:4300"
      - "4399:4399"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  auth-stub:
    build:
      context: ..
      dockerfile: apps/auth-stub/Dockerfile
    environment:
      PORT: "4310"
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      SERVER_API_KEY: ${SERVER_API_KEY:-dev-server-key-change-me}
      REALTIME_HTTP_URL: http://haproxy:4300
      REALTIME_NODE_URLS: http://node-1:4301,http://node-2:4302,http://node-3:4303
      PUBLIC_WS_URL: ws://localhost:4300/v1/connect
      ALLOWED_ORIGINS: http://localhost:4321,http://127.0.0.1:4321
    depends_on: [haproxy]
    ports:
      - "4310:4310"

  demo:
    build:
      context: ..
      dockerfile: apps/demo/Dockerfile
    depends_on: [auth-stub]
    ports:
      - "4321:4321"

  seed:
    image: node:22-alpine
    profiles: ["seed"]
    working_dir: /repo
    volumes:
      - ../scripts:/repo/scripts:ro
    environment:
      REALTIME_HTTP_URL: http://haproxy:4300
      SERVER_API_KEY: ${SERVER_API_KEY:-dev-server-key-change-me}
    command: ["node", "scripts/seed.mjs"]
    depends_on: [haproxy]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.listen-address=:4390"]
    ports:
      - "4390:4390"

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SERVER_HTTP_PORT: "4391"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      PROMETHEUS_URL: http://prometheus:4390
      GRAFANA_DASHBOARDS_DIR: /var/lib/grafana/dashboards
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "4391:4391"
    depends_on: [prometheus]

  loadgen:
    build:
      context: ..
      dockerfile: apps/loadgen/Dockerfile
    profiles: ["load"]
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      SERVER_API_KEY: ${SERVER_API_KEY:-dev-server-key-change-me}
    command:
      - node
      - dist/cli.js
      - fanout-big-room
      - --nodes
      - http://node-1:4301,http://node-2:4302,http://node-3:4303
      - --haproxy
      - http://haproxy:4300
      - --connections
      - "10000"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      replicas: 2
