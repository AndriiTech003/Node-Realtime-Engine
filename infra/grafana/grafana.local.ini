[server]
http_addr = 127.0.0.1
http_port = 4391
root_url = http://127.0.0.1:4391/

[security]
admin_user = admin
admin_password = realtime-local
disable_gravatar = true

[auth.anonymous]
enabled = true
org_role = Viewer

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[plugins]
preinstall_disabled = true
preinstall_auto_update = false
plugin_admin_enabled = false
public_key_retrieval_disabled = true
plugin_catalog_url = http://127.0.0.1:4391/

[grafana_com]
url = http://127.0.0.1:4391
api_url = http://127.0.0.1:4391/api

[grafana_net]
url = http://127.0.0.1:4391

[cloud_migration]
enabled = false

[snapshots]
external_enabled = false

[unified_alerting]
enabled = false

[log]
mode = console
level = warn
