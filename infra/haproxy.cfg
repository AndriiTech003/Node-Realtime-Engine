global
    maxconn 4800
    fd-hard-limit 10240
    log stdout format raw local0 warning

defaults
    mode http
    log global
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout tunnel 1h
    timeout client-fin 5s
    timeout http-request 10s

frontend realtime
    bind "${HAPROXY_BIND}"
    default_backend realtime_nodes

backend realtime_nodes
    balance leastconn
    option redispatch
    retries 3
    option httpchk GET /health/ready
    http-check expect status 200
    default-server inter 1s fall 2 rise 2 maxconn 4800
    server node-1 "${NODE1_ADDR}" check
    server node-2 "${NODE2_ADDR}" check
    server node-3 "${NODE3_ADDR}" check

frontend stats
    bind "${HAPROXY_STATS_BIND}"
    stats enable
    stats uri /
    stats refresh 2s
    http-request use-service prometheus-exporter if { path /metrics }
