global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: realtime
    metrics_path: /metrics
    static_configs:
      - targets: ["node-1:4301", "node-2:4302", "node-3:4303"]
  - job_name: haproxy
    metrics_path: /metrics
    static_configs:
      - targets: ["haproxy:4399"]
